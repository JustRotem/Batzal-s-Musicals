# Dedicated upload origin for large clip-video POST requests.
# This host should stay non-proxied in Cloudflare so uploads do not hit Cloudflare body-size limits.

server {
  listen 80;
  server_name upload.batzal.net;

  # Allow intended clip uploads at the proxy layer before the request reaches Next.js.
  client_max_body_size 1536m;

  location / {
    proxy_pass http://127.0.0.1:3000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  location /api/admin/clip-video {
    client_max_body_size 1536m;
    proxy_pass http://127.0.0.1:3000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }
}
