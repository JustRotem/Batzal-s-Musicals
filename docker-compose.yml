services:
  postgres:
    image: postgres:16
    container_name: batzals-musicals-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: musicals
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d musicals"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: batzals-musicals-app
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql://postgres:postgres@postgres:5432/musicals?schema=public}
      APP_URL: ${APP_URL:-http://localhost:3000}
      NEXT_PUBLIC_APP_URL: ${NEXT_PUBLIC_APP_URL:-http://localhost:3000}
      CLIP_UPLOAD_BASE_URL: ${CLIP_UPLOAD_BASE_URL:-http://localhost:3000}
      CLIP_UPLOAD_AUTH_SECRET: ${CLIP_UPLOAD_AUTH_SECRET:-}
      FROM_EMAIL_NAME: ${FROM_EMAIL_NAME:-Batzal's Musicals}
      FROM_EMAIL: ${FROM_EMAIL:-no-reply@batzal.net}
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      TURNSTILE_SITE_KEY: ${TURNSTILE_SITE_KEY:-}
      TURNSTILE_SECRET_KEY: ${TURNSTILE_SECRET_KEY:-}
      PORT: 3000
    ports:
      - "3000:3000"
    volumes:
      - /var/www/musicals/public/uploads:/app/public/uploads
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3000/api/health').then((res)=>process.exit(res.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 40s

volumes:
  postgres_data: